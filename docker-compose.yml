version: "3.9"

services:
  app:
    build: .
    container_name: mini-jira-node
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mini_jira:password@postgres:5432/mini_jira?schema=public
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: mini-jira-postgres
    restart: always
    environment:
      POSTGRES_USER: mini_jira
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mini_jira
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
